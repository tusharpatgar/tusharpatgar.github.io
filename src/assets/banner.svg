<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
    </pattern>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #38bdf8; letter-spacing: 0.8px; text-transform: uppercase; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
    .code-pill { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #e2e8f0; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #cbd5e1; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="880" height="260" rx="16" fill="url(#grid)" />

  <!-- Ambient Ambient Lighting -->
  <circle cx="120" cy="40" r="80" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="780" cy="180" r="90" fill="#818cf8" opacity="0.10" filter="url(#softGlow)" />
  <circle cx="450" cy="240" r="70" fill="#10b981" opacity="0.08" filter="url(#softGlow)" />

  <!-- Top Accent Border Line -->
  <path d="M 16 1.5 L 864 1.5" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==================== LEFT SECTION: IDENTITY ==================== -->
  <!-- Status Badge -->
  <g transform="translate(36, 32)">
    <rect width="245" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#22c55e" />
    <circle cx="14" cy="13" r="8" fill="#22c55e" opacity="0.25" />
    <text x="27" y="17" class="subtitle" font-size="11">Data Engineer | ETL Developer</text>
  </g>

  <!-- Name -->
  <text x="36" y="96" class="title">Tushar T Patgar</text>

  <!-- Positioning Line -->
  <text x="36" y="125" class="desc">Engineering Enterprise ETL/ELT Pipelines &amp; Cloud Data Lakehouses</text>
  <text x="36" y="145" class="desc" fill="#64748b" font-size="13">Specializing in Python • PySpark • AWS Cloud • Databricks • Delta Lake • T-SQL</text>

  <!-- Highlights Pills -->
  <g transform="translate(36, 168)">
    <!-- Pill 1: Location -->
    <g transform="translate(0, 0)">
      <rect width="135" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="meta-text">📍 Bengaluru, India</text>
    </g>

    <!-- Pill 2: Experience -->
    <g transform="translate(145, 0)">
      <rect width="155" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="meta-text">💼 1.4 Years Experience</text>
    </g>

    <!-- Pill 3: Focus -->
    <g transform="translate(310, 0)">
      <rect width="150" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="meta-text">🏛️ FinTech &amp; Analytics</text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: ARCHITECTURE PIPELINE ==================== -->
  <g transform="translate(500, 32)">
    <!-- Pipeline Container Box -->
    <rect width="344" height="195" rx="12" fill="#0b1329" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />

    <!-- Box Header -->
    <rect width="344" height="30" rx="12" fill="#0f172a" />
    <rect y="20" width="344" height="10" fill="#0f172a" />
    <line x1="0" y1="30" x2="344" y2="30" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="40" cy="15" r="4" fill="#10b981" opacity="0.8" />
    <text x="56" y="19" class="node-sub" fill="#94a3b8" font-size="10">MEDALLION ARCHITECTURE &amp; CDC PIPELINE</text>

    <!-- Connection Bus / Pipeline Line -->
    <path d="M 40 70 L 304 70" stroke="url(#pipelineGrad)" stroke-width="2.5" stroke-dasharray="4 2" />

    <!-- Node 1: Ingestion -->
    <g transform="translate(20, 52)">
      <circle cx="18" cy="18" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">IN</text>
      <text x="18" y="46" text-anchor="middle" class="node-text">Ingestion</text>
      <text x="18" y="58" text-anchor="middle" class="node-sub">CDC / DMS</text>
    </g>

    <!-- Node 2: Bronze -->
    <g transform="translate(86, 52)">
      <circle cx="18" cy="18" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a855f7">BR</text>
      <text x="18" y="46" text-anchor="middle" class="node-text">Bronze</text>
      <text x="18" y="58" text-anchor="middle" class="node-sub">Raw S3</text>
    </g>

    <!-- Node 3: Silver -->
    <g transform="translate(152, 52)">
      <circle cx="18" cy="18" r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8">SL</text>
      <text x="18" y="46" text-anchor="middle" class="node-text">Silver</text>
      <text x="18" y="58" text-anchor="middle" class="node-sub">Cleansed</text>
    </g>

    <!-- Node 4: Gold -->
    <g transform="translate(218, 52)">
      <circle cx="18" cy="18" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b">GL</text>
      <text x="18" y="46" text-anchor="middle" class="node-text">Gold</text>
      <text x="18" y="58" text-anchor="middle" class="node-sub">Curated</text>
    </g>

    <!-- Node 5: Serve -->
    <g transform="translate(284, 52)">
      <circle cx="18" cy="18" r="16" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">WH</text>
      <text x="18" y="46" text-anchor="middle" class="node-text">Warehouse</text>
      <text x="18" y="58" text-anchor="middle" class="node-sub">SQL / Redshift</text>
    </g>

    <!-- Tech Stack Pill Footer inside right card -->
    <g transform="translate(16, 142)">
      <rect width="312" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="156" y="17" text-anchor="middle" class="node-sub" fill="#94a3b8">STACK CAPABILITIES</text>
      <text x="156" y="31" text-anchor="middle" class="code-pill" fill="#38bdf8">PySpark • Delta Lake • Glue • Redshift • SSIS</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(36, 214)">
    <text x="0" y="16" class="code-pill" fill="#64748b">&gt; status: <tspan fill="#22c55e">ready_for_impact</tspan> | target: <tspan fill="#38bdf8">Data Engineer / ETL Developer</tspan> | integrity: <tspan fill="#a855f7">validated</tspan></text>
  </g>
</svg>
